openapi: 3.1.0
info:
  title: JWH Intranet Phonelist API
  version: 2.5.0
  summary: Push companies, divisions and staff from Data Hub into the JWH intranet phone list.
  contact:
    name: Constructive Media
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Data Hub sends a snapshot: every record of a type, whenever any of them has changed. The intranet works out the
    rest: new records are created, changed ones updated, unchanged ones skipped, and ones no longer listed removed.
    Data Hub doesn't need to track what changed.

    ## Rules

    1. **Records are matched by `id`**, the Data Hub ID of the company, division or staff member. Our own IDs are never
       returned, and records are never matched by name.
    2. **Snapshots are the truth**: what a snapshot sends always wins, and `updated_at` is optional in one. Single
       records and batches need `updated_at`, as `YYYY-MM-DDTHH:MM:SS[.fraction](Z|±HH:MM)`, e.g.
       `2026-10-15T09:30:00+08:00` (fractions past 6 digits are cut to 6). For those, a record older than the one we
       hold, or not newer than its deletion, is refused with `409`.
    3. **Every request carries the token** (see Authentication).
    4. **Dates are `YYYY-MM-DD`**, booleans `true` or `false`, and empty values `null`. Field names are exactly as in the
       schemas. Unknown fields are ignored.
    5. **Errors are [Problem Details](https://www.rfc-editor.org/rfc/rfc9457)** (`application/problem+json`). Validation
       errors list each field that failed.

    ## Authentication

    Send `Authorization: Bearer <token>` with every request, reads included. WordPress logins are not accepted.

    - A missing, malformed or wrong token gets `401`.
    - Constructive Media issues the token, one per site. If it leaks, ask us to rotate it.
    - Only send it over HTTPS.

    ```bash
    curl -X PUT "$BASE/staff/10423" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
      --data '{"id":"10423","updated_at":"2026-10-15T09:30:00+08:00","first_name":"Jane","last_name":"Citizen","status":"active"}'
    ```

    ## Endpoints

    | To | Use |
    |---|---|
    | **Send every record of one type (the main way in)** | `PUT /{type}` |
    | Create a record, or replace all of its fields | `PUT /{type}/{id}` |
    | Change some fields of a record | `PATCH /{type}/{id}` |
    | Remove a record | `DELETE /{type}/{id}` |
    | Send up to 500 changes of any type | `POST /batch` |

    `{type}` is `companies`, `divisions` or `staff`. Check for changes as often as suits, e.g. every few minutes, and
    when anything of a type has changed, send a snapshot of that type. Send divisions before staff. The single-record
    and batch endpoints are there if they're ever useful; snapshots alone are enough.

    ## Replies and retries

    Snapshots and batches are processed while you wait, and reply `200` with how many records were created, updated,
    left unchanged and deleted, plus `problems`: only the records that failed or have warnings. An empty `problems`
    means everything went in. A large snapshot can take a while, so allow a few minutes before timing out.

    - **Everything is safe to resend.** Sending the same data again comes back `unchanged`. If a request fails or times
      out, send it again.
    - **On `503` or a network error**, retry after 5 seconds, then 30 seconds, 2 minutes and 10 minutes.
servers:
  - url: http://intranet.jwh.com.au.internal/wp-json/phonelist/v2
    description: Production
security:
  - BearerToken: []

tags:
  - name: Push
    description: Create, change and remove single records.
  - name: Bulk
    description: Snapshots and batches.
  - name: Read
    description: What the intranet holds.

paths:
  /{type}/{id}:
    parameters:
      - $ref: '#/components/parameters/Type'
      - $ref: '#/components/parameters/Id'
    put:
      operationId: putRecord
      tags: [Push]
      summary: Create or replace a record
      description: |
        Send the whole record. Fields left out are cleared. `id` in the body is optional, but must match the URL if sent.
        A staff member sent with `status: inactive` is removed, and the reply is `200` with `result: deleted`
        (`unchanged` if they weren't on the phone list).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/Staff'
                - $ref: '#/components/schemas/Division'
                - $ref: '#/components/schemas/Company'
            examples:
              staff:
                summary: Staff member (PUT /staff/10423)
                value:
                  updated_at: '2026-10-15T09:30:00+08:00'
                  first_name: Jane
                  last_name: Citizen
                  preferred_name: Janey
                  email: jane.citizen@jwh.com.au
                  mobile: '0437 793 226'
                  phone: '08 9464 7800'
                  extension: '4123'
                  position: JWH Estimator
                  position_number: P1042
                  department_code: '20'
                  department: Construction
                  division_id: JWH
                  reports_to: P1001
                  status: active
                  start_date: '2011-03-14'
                  on_leave_until: null
                  date_of_birth: '1985-09-05'
                  hide_birthday: false
                  photo_url: null
              division:
                summary: Division (PUT /divisions/BNB)
                value:
                  updated_at: '2026-10-15T09:30:00+08:00'
                  name: WA Country Builders (Bunbury)
                  phone: '08 9721 0000'
                  address_line1: 1 Example Street
                  address_line2: null
                  postcode: '6230'
                  postal_address: PO Box 1, Bunbury WA 6231
              company:
                summary: Company (PUT /companies/7)
                value:
                  updated_at: '2026-10-15T09:30:00+08:00'
                  name: JWH Group
      responses:
        '200': { $ref: '#/components/responses/Result' }
        '201': { $ref: '#/components/responses/Result' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Stale' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Invalid' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    patch:
      operationId: patchRecord
      tags: [Push]
      summary: Change some fields
      description: |
        Any fields of the type's schema. Only the fields sent change, and `null` clears a field. `updated_at` is
        required. The record must already exist; use PUT to create it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updated_at]
              properties:
                updated_at: { $ref: '#/components/schemas/UpdatedAt' }
              additionalProperties: true
            example:
              updated_at: '2026-10-15T10:00:00+08:00'
              position: JWH Senior Estimator
              on_leave_until: '2026-11-01'
      responses:
        '200': { $ref: '#/components/responses/Result' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Stale' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Invalid' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      operationId: deleteRecord
      tags: [Push]
      summary: Remove a record
      description: |
        `updated_at` is required, in the JSON body or the query string. In the query string, encode `+` as `%2B`.
        Deleting a record that's already gone also returns `204`.
      parameters:
        - name: updated_at
          in: query
          required: false
          description: Required here if not in the body.
          schema: { $ref: '#/components/schemas/UpdatedAt' }
          example: '2026-10-15T09:30:00+08:00'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                updated_at: { $ref: '#/components/schemas/UpdatedAt' }
            example: { updated_at: '2026-10-15T09:30:00+08:00' }
      responses:
        '204': { description: 'Deleted, or already gone.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Stale' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      operationId: getRecord
      tags: [Read]
      summary: Read a record
      description: The record as stored.
      responses:
        '200':
          description: The record.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Staff'
                  - $ref: '#/components/schemas/Division'
                  - $ref: '#/components/schemas/Company'
              examples: { staff: { $ref: '#/components/examples/StaffRecord' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /{type}:
    parameters:
      - $ref: '#/components/parameters/Type'
    put:
      operationId: putSnapshot
      tags: [Bulk]
      summary: Send a snapshot
      description: |
        Every record of one type, up to 5,000 and 5 MB. The snapshot is the truth: after it, the intranet holds exactly
        these records. The reply counts what happened (see Replies and retries). Each record is matched by `id`:

        | Record | Result |
        |---|---|
        | Not held yet | `created` |
        | Held, with different values | `updated` |
        | Held, with the same values | `unchanged` (skipped) |
        | Staff with `status: inactive` | `deleted`, or `unchanged` if already gone |
        | Held but not in the snapshot | `deleted` |

        - `updated_at` is optional in a snapshot and never blocks anything: what's sent always wins.
        - Every staff member or division not in the snapshot is deleted, including any with no Data Hub ID. Companies
          the intranet created itself are kept.
        - Nothing is deleted if any record has no usable `id` (a non-empty string), because that record couldn't be
          matched. `problems` then ends with an `error` entry.
        - An empty snapshot is refused with `422`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [records]
              properties:
                records:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items:
                    anyOf:
                      - $ref: '#/components/schemas/Staff'
                      - $ref: '#/components/schemas/Division'
                      - $ref: '#/components/schemas/Company'
            examples:
              staff:
                summary: Staff (PUT /staff)
                value:
                  records:
                    - { id: '10423', updated_at: '2026-10-15T09:30:00+08:00', first_name: Jane, last_name: Citizen, status: active, division_id: JWH, position: JWH Estimator, mobile: '0437 793 226' }
                    - { id: '10424', updated_at: '2026-09-02T14:10:00+08:00', first_name: Sam, last_name: Example, status: active, division_id: BNB, reports_to: P1001 }
              divisions:
                summary: Divisions (PUT /divisions)
                value:
                  records:
                    - { id: BNB, updated_at: '2026-10-15T02:00:00+08:00', name: WA Country Builders (Bunbury), phone: '08 9721 0000', address_line1: 1 Example Street, address_line2: null, postcode: '6230', postal_address: null }
                    - { id: JWH, updated_at: '2026-10-15T02:00:00+08:00', name: JWH Group, phone: '08 9464 7800', address_line1: null, address_line2: null, postcode: null, postal_address: null }
      responses:
        '200': { $ref: '#/components/responses/Report' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      operationId: listRecords
      tags: [Read]
      summary: List records
      description: |
        Every record held, sorted by name. Records the intranet created itself, such as a company, have `id` and
        `updated_at` set to `null`.
      parameters:
        - { name: name, in: query, description: 'Staff only: any word of the name starts with this (case-insensitive).', schema: { type: string }, example: jan }
        - { name: division_id, in: query, description: 'Staff only: exact division ID.', schema: { type: string }, example: JWH }
        - { name: department_code, in: query, description: 'Staff only: exact department code.', schema: { type: string }, example: '20' }
      responses:
        '200':
          description: All records, sorted by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  anyOf:
                    - $ref: '#/components/schemas/Staff'
                    - $ref: '#/components/schemas/Division'
                    - $ref: '#/components/schemas/Company'
              examples: { staff: { $ref: '#/components/examples/StaffList' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /staff/{id}/team:
    get:
      operationId: getTeam
      tags: [Read]
      summary: A manager's team
      description: Staff whose `reports_to` is this person's `position_number`, sorted by name.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Staff records.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Staff' }
              examples: { staff: { $ref: '#/components/examples/StaffList' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /batch:
    post:
      operationId: postBatch
      tags: [Bulk]
      summary: Send a batch
      description: |
        Up to 500 operations of any type, each with an `op`: `put` (create or replace), `patch` (change the fields
        sent) or `delete`. They run in order, and each succeeds or fails on its own. A staff member can arrive before
        their division or manager; they're linked once both exist. The reply counts what happened, as for a snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operations]
              properties:
                operations:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: '#/components/schemas/Operation' }
            example:
              operations:
                - { op: put, type: divisions, id: BNB, data: { updated_at: '2026-10-15T09:30:00+08:00', name: 'WA Country Builders (Bunbury)' } }
                - { op: patch, type: staff, id: '10423', data: { updated_at: '2026-10-15T09:30:00+08:00', division_id: BNB } }
                - { op: delete, type: staff, id: '10099', data: { updated_at: '2026-10-15T09:30:00+08:00' } }
      responses:
        '200': { $ref: '#/components/responses/Report' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /club:
    get:
      operationId: getClub
      tags: [Read]
      summary: JWH Club
      description: The JWH Club levels in page order, each with its members.
      responses:
        '200':
          description: Levels with at least one member.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    level: { type: string, examples: ['40-year-club'] }
                    title: { type: string, examples: ['40 Year Club'] }
                    description: { type: string }
                    logo: { type: [string, 'null'], format: uri }
                    members:
                      type: array
                      description: Staff as shown on the club page.
                      items: { type: object }
              example:
                - { level: 40-year-club, title: 40 Year Club, description: Celebrating 40 years with JWH Group., logo: null, members: [{ id: '10007', name: Julian Walter, company: JWH Group }] }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
      description: The token Constructive Media issues for this site. See Authentication.

  parameters:
    Type:
      name: type
      in: path
      required: true
      description: companies, divisions or staff.
      schema: { type: string, enum: [companies, divisions, staff] }
      example: staff
    Id:
      name: id
      in: path
      required: true
      description: The Data Hub ID (1–64 characters).
      schema: { type: string, minLength: 1, maxLength: 64 }
      example: '10423'

  examples:
    StaffRecord:
      summary: A staff record
      value: &staffRecord
        id: '10423'
        updated_at: '2026-10-15T09:30:00+08:00'
        preferred_name: Janey
        first_name: Jane
        last_name: Citizen
        email: jane.citizen@jwh.com.au
        mobile: '+61437793226'
        phone: '+61894647800'
        extension: '4123'
        home_phone: null
        position: JWH Estimator
        position_number: P1042
        position_abbr: EST
        job: Estimating
        job_type: Full time
        award_code: null
        department_code: '20'
        department: Construction
        division_id: JWH
        company_id: '1'
        reports_to: P1001
        status: active
        start_date: '2011-03-14'
        on_leave_until: null
        date_of_birth: '1985-09-05'
        hide_birthday: false
        photo_url: null
    StaffList:
      summary: Staff records, sorted by name
      value: [*staffRecord]

  responses:
    Result:
      description: What happened to the record.
      content:
        application/json:
          schema:
            type: object
            properties:
              result: { type: string, enum: [created, updated, unchanged, deleted] }
              message: { type: string }
              warnings:
                description: Values that were kept but should be fixed in Data Hub, such as a phone number that couldn't be read.
                type: array
                items: { $ref: '#/components/schemas/FieldError' }
          examples:
            created: { value: { result: created } }
            unchanged_with_warning: { value: { result: unchanged, warnings: [{ field: mobile, message: "Not a phone number we could read; kept as sent." }] } }
            inactive: { value: { result: deleted, message: "Status 'inactive' is not kept on the phone list." } }
    Report:
      description: Processed. How many records had each result, and the ones that need a look.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Report' }
          examples:
            all_good:
              summary: Everything went in
              value: { created: 2, updated: 14, unchanged: 1210, deleted: 1, ids: { created: ['10441', '10442'], updated: ['10007', '10123'], deleted: ['10388'] }, problems: [] }
            with_problems:
              summary: Some records need a look
              value:
                created: 0
                updated: 3
                unchanged: 1208
                deleted: 0
                invalid: 2
                error: 1
                ids: { created: [], updated: ['10007', '10123', '10440'], deleted: [] }
                problems:
                  - { id: '10424', type: staff, op: put, result: invalid, errors: [{ field: status, message: 'Must be one of: active, inactive.' }] }
                  - { id: null, type: staff, op: put, result: invalid, errors: [{ field: id, message: 'Required: the Data Hub ID, as a string.' }] }
                  - { id: '10440', type: staff, op: put, result: updated, warnings: [{ field: mobile, message: "Not a phone number we could read; kept as sent." }] }
                  - { id: null, type: staff, op: delete, result: error, message: 'Some records have no usable id (a non-empty string), so nothing was deleted.' }
    BadRequest:
      description: The body isn't valid JSON, or isn't a JSON object.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: about:blank, title: Bad request, status: 400, detail: The body must be a JSON object. }
    Unauthorized:
      description: Bearer token missing, malformed or wrong.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: about:blank, title: Unauthorized, status: 401, detail: Bearer token invalid. }
    NotFound:
      description: No record with this ID.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: about:blank, title: Not found, status: 404, detail: No record with this ID. Send the whole record with PUT to create it. }
    Stale:
      description: Older than the stored record, or not newer than its deletion. Nothing was changed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: about:blank, title: Older than the stored record, status: 409, detail: 'Older than the stored record (2026-10-15T09:30:00+08:00).' }
    TooLarge:
      description: Body over 5 MB, batch over 500 operations, or snapshot over 5,000 records.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: about:blank, title: Request too large, status: 413, detail: At most 500 operations per request. }
    Invalid:
      description: Validation failed, with `errors` listing each field. Also an empty batch or snapshot.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: about:blank#validation, title: Invalid record, status: 422, detail: '', errors: [{ field: last_name, message: Required. }] }
    ServerError:
      description: The record couldn't be saved. Retry with back-off.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: about:blank, title: Could not be saved, status: 500, detail: '…' }
    Unavailable:
      description: The API isn't set up on the site (no token configured). Retry with back-off, and let us know.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: about:blank, title: Request failed, status: 503, detail: The API is not configured on this site. }

  schemas:
    UpdatedAt:
      type: string
      format: date-time
      description: 'YYYY-MM-DDTHH:MM:SS[.fraction](Z|±HH:MM), e.g. 2026-10-15T09:30:00+08:00. Optional in snapshots.'
    Date:
      type: [string, 'null']
      format: date
      description: YYYY-MM-DD.
    Text:
      type: [string, 'null']
      maxLength: 1000
    Phone:
      type: [string, 'null']
      description: Any format. Stored as E.164 (+61…). A number that can't be read is kept as sent, with a warning.

    Company:
      type: object
      required: [updated_at, name]
      properties:
        id: { type: string, maxLength: 64, description: 'Data Hub ID. Required in snapshots. In a single PUT it comes from the URL. `null` in reads for companies the intranet created.' }
        updated_at: { $ref: '#/components/schemas/UpdatedAt' }
        name: { type: string }

    Division:
      type: object
      description: Which company a division belongs to is set on the intranet, not by Data Hub.
      required: [updated_at, name]
      properties:
        id: { type: string, maxLength: 64, description: 'Data Hub ID. Required in snapshots. In a single PUT it comes from the URL.' }
        updated_at: { $ref: '#/components/schemas/UpdatedAt' }
        name: { type: string, description: 'As shown on the intranet, e.g. "WA Country Builders (Bunbury)".' }
        phone: { $ref: '#/components/schemas/Phone' }
        address_line1: { $ref: '#/components/schemas/Text' }
        address_line2: { $ref: '#/components/schemas/Text' }
        postcode: { $ref: '#/components/schemas/Text' }
        postal_address: { $ref: '#/components/schemas/Text' }

    Staff:
      type: object
      required: [updated_at, first_name, last_name, status]
      properties:
        id: { type: string, maxLength: 64, description: 'Data Hub ID. Required in snapshots. In a single PUT it comes from the URL.' }
        updated_at: { $ref: '#/components/schemas/UpdatedAt' }
        first_name: { type: string }
        last_name: { type: string }
        preferred_name: { $ref: '#/components/schemas/Text', description: Shown instead of first_name when set. }
        email: { type: [string, 'null'], format: email }
        mobile: { $ref: '#/components/schemas/Phone' }
        phone: { $ref: '#/components/schemas/Phone', description: Direct number. }
        extension: { $ref: '#/components/schemas/Text', description: VoIP extension. }
        home_phone: { $ref: '#/components/schemas/Phone', description: 'Home or after-hours number. Never shown on the intranet.' }
        position: { $ref: '#/components/schemas/Text', description: 'As in HR, e.g. "PHM Sales Manager".' }
        position_number: { $ref: '#/components/schemas/Text' }
        position_abbr: { $ref: '#/components/schemas/Text' }
        job: { $ref: '#/components/schemas/Text' }
        job_type: { $ref: '#/components/schemas/Text' }
        award_code: { $ref: '#/components/schemas/Text' }
        department_code: { $ref: '#/components/schemas/Text' }
        department: { $ref: '#/components/schemas/Text' }
        division_id: { $ref: '#/components/schemas/Text', description: "The division's Data Hub ID." }
        company_id: { $ref: '#/components/schemas/Text', description: Stored as sent. The company shown comes from the division. }
        reports_to: { $ref: '#/components/schemas/Text', description: "The manager's position number (their `position_number`)." }
        status:
          type: string
          description: '`active` is on the phone list. `inactive` removes them, and a PUT replies `200` with `result: deleted`. Anything else is refused with `422`.'
          enum: [active, inactive]
        start_date: { $ref: '#/components/schemas/Date' }
        on_leave_until: { $ref: '#/components/schemas/Date', description: The last day of their current leave. `null` when not on leave. }
        date_of_birth: { $ref: '#/components/schemas/Date', description: 'Only the day and month are shown, as a birthday.' }
        hide_birthday: { type: [boolean, 'null'], description: '`true` keeps them off the birthday list.' }
        photo_url: { type: [string, 'null'], format: uri, description: 'An http or https URL. The photo is downloaded when the URL changes.' }

    Operation:
      type: object
      required: [op, type, id, data]
      properties:
        op: { type: string, enum: [put, patch, delete] }
        type: { type: string, enum: [companies, divisions, staff] }
        id: { type: string, maxLength: 64 }
        data:
          type: object
          description: The record (put), the fields to change (patch), or only `updated_at` (delete). `updated_at` is always required.

    Report:
      type: object
      description: |
        A count per result. `created`, `updated`, `unchanged` and `deleted` are always present; `stale`, `invalid`,
        `not_found` and `error` only when they happened.
      required: [created, updated, unchanged, deleted, ids, problems]
      properties:
        created: { type: integer }
        updated: { type: integer }
        unchanged: { type: integer }
        deleted: { type: integer, description: 'Removed: missing from the snapshot, status inactive, or a delete.' }
        stale: { type: integer }
        invalid: { type: integer }
        not_found: { type: integer }
        error: { type: integer }
        ids:
          type: object
          description: The IDs of the records created, updated and deleted. Records deleted for having no Data Hub ID aren't listed.
          properties:
            created: { type: array, items: { type: string } }
            updated: { type: array, items: { type: string } }
            deleted: { type: array, items: { type: string } }
        problems:
          type: array
          description: Only the records that didn't go in, or went in with warnings. Empty when everything went in cleanly.
          items:
            type: object
            properties:
              id: { type: [string, 'null'] }
              type: { type: [string, 'null'] }
              op: { type: [string, 'null'] }
              result:
                type: string
                enum: [created, updated, unchanged, deleted, stale, invalid, not_found, error]
                x-enum-descriptions:
                  created: New record (listed only for its warnings).
                  updated: Changed (listed only for its warnings).
                  unchanged: Same data (listed only for its warnings).
                  deleted: Removed (listed only for its warnings).
                  stale: Older than what we hold. Nothing changed.
                  invalid: Failed validation. See errors.
                  not_found: PATCH of a record we don't hold.
                  error: Server error, or a snapshot's deletions were refused. See message.
              message: { type: string }
              errors:
                type: array
                items: { $ref: '#/components/schemas/FieldError' }
              warnings:
                type: array
                items: { $ref: '#/components/schemas/FieldError' }

    FieldError:
      type: object
      properties:
        field: { type: string }
        message: { type: string }

    Problem:
      type: object
      description: RFC 9457 Problem Details.
      properties:
        type: { type: string, description: '`about:blank`, or `about:blank#validation` when `errors` is present.' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
